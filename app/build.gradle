plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-parcelize'
    // KAPT is still required for Data Binding only - Google has no plans to migrate Data Binding to KSP
    // Consider migrating to View Binding + Jetpack Compose to fully eliminate KAPT
    id 'kotlin-kapt'
    id 'com.google.devtools.ksp'
    id 'androidx.navigation.safeargs.kotlin'
    id 'com.google.android.gms.oss-licenses-plugin'
}

android {
    compileSdk = 36
    defaultConfig {
        applicationId "goodtime.training.wod.timer"
        minSdkVersion 26
        targetSdkVersion 36
        versionCode 33
        versionName "0.9.12"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
        dataBinding true
    }
    namespace 'goodtime.training.wod.timer'
}

dependencies {
    // Core library desugaring for Java 8+ features (needed for java.time)
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    // AndroidX Core
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    // Lifecycle components (lifecycle-extensions deprecated - individual components used instead)
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'

    // Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.6'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.6'

    // Preferences
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // Dependency Injection - Kodein
    implementation 'org.kodein.di:kodein-di-jvm:7.30.0'
    implementation 'org.kodein.di:kodein-di-framework-android-x:7.30.0'

    // Room Database
    implementation 'androidx.room:room-runtime:2.8.4'
    implementation 'androidx.room:room-ktx:2.8.4'
    ksp 'androidx.room:room-compiler:2.8.4'

    // JSON Parsing
    implementation 'com.google.code.gson:gson:2.13.2'

    // CSV Parsing for SmartWOD import
    implementation 'com.github.doyaaaaaken:kotlin-csv-jvm:1.10.0'

    // Event Bus
    implementation 'org.greenrobot:eventbus:3.3.1'

    // UI Components
    implementation 'com.github.beksomega:loopinglayout:0.5.0'
    implementation 'nl.dionsegijn:konfetti:1.3.2'
    implementation 'com.github.skydoves:balloon:1.6.13'

    // Charts for Statistics
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // Google Play Services
    implementation 'com.google.android.play:review-ktx:2.0.2'
    implementation 'com.google.android.play:app-update-ktx:2.1.0'
    implementation 'com.google.android.gms:play-services-oss-licenses:17.3.0'
    implementation 'com.android.billingclient:billing-ktx:8.1.0'
}
