[versions]
# Plugin versions
agp = "8.13.1"
kotlin = "2.2.21"
ksp = "2.3.1"
navigationSafeArgs = "2.9.6"
ossLicensesPlugin = "0.10.9"

# SDK versions
compileSdk = "36"
minSdk = "26"
targetSdk = "36"

# AndroidX versions
appcompat = "1.7.1"
coreKtx = "1.17.0"
material = "1.13.0"
constraintlayout = "2.2.1"
recyclerview = "1.4.0"
lifecycle = "2.10.0"
navigation = "2.9.6"
preference = "1.2.1"
room = "2.8.4"

# Google Play Services
playServicesOssLicenses = "17.3.0"
playReview = "2.0.2"
playAppUpdate = "2.1.0"
billing = "8.1.0"

# Dependency Injection
kodein = "7.30.0"

# Other libraries
desugarJdkLibs = "2.1.5"
gson = "2.13.2"
kotlinCsv = "1.10.0"
eventbus = "3.3.1"
loopinglayout = "0.5.0"
konfetti = "1.3.2"
mpAndroidChart = "v3.1.0"

[libraries]
# Core library desugaring
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }

# AndroidX Core
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# Lifecycle
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }

# Navigation
androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigation" }

# Preferences
androidx-preference-ktx = { group = "androidx.preference", name = "preference-ktx", version.ref = "preference" }

# Room Database
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Dependency Injection - Kodein
kodein-di-jvm = { group = "org.kodein.di", name = "kodein-di-jvm", version.ref = "kodein" }
kodein-di-framework-android = { group = "org.kodein.di", name = "kodein-di-framework-android-x", version.ref = "kodein" }

# JSON and CSV Parsing
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
kotlin-csv-jvm = { group = "com.github.doyaaaaaken", name = "kotlin-csv-jvm", version.ref = "kotlinCsv" }

# Event Bus
eventbus = { group = "org.greenrobot", name = "eventbus", version.ref = "eventbus" }

# UI Components
loopinglayout = { group = "com.github.beksomega", name = "loopinglayout", version.ref = "loopinglayout" }
konfetti = { group = "nl.dionsegijn", name = "konfetti", version.ref = "konfetti" }

# Charts
mp-android-chart = { group = "com.github.PhilJay", name = "MPAndroidChart", version.ref = "mpAndroidChart" }

# Google Play Services
play-services-oss-licenses = { group = "com.google.android.gms", name = "play-services-oss-licenses", version.ref = "playServicesOssLicenses" }
play-review-ktx = { group = "com.google.android.play", name = "review-ktx", version.ref = "playReview" }
play-app-update-ktx = { group = "com.google.android.play", name = "app-update-ktx", version.ref = "playAppUpdate" }
billing-ktx = { group = "com.android.billingclient", name = "billing-ktx", version.ref = "billing" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
navigation-safeargs = { id = "androidx.navigation.safeargs.kotlin", version.ref = "navigationSafeArgs" }
oss-licenses = { id = "com.google.android.gms.oss-licenses-plugin", version.ref = "ossLicensesPlugin" }
